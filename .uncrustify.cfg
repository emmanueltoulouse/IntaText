# Uncrustify config pour IntaText (Vala)
# Style proche K&R, indentation 4 espaces, accolades sur la même ligne

# — Indentation —
indent_with_tabs = 0          # 0=espaces, 1=tabs, 2=mix
indent_columns   = 4
input_tab_size   = 4
output_tab_size  = 4
indent_brace     = 0
indent_func_call_param = true
indent_func_def_param  = true
indent_switch_case     = 0    # ne pas indenter les case sous switch
indent_case_brace      = 0
indent_label           = 0

# — Espaces —
sp_arith          = force
sp_assign         = force
sp_bool           = force
sp_compare        = force
sp_before_sparen  = force   # if ( ... )
sp_inside_sparen  = remove  # pas d’espace à l’intérieur des ( )
sp_after_comma    = force

# — Accolades (même ligne) —
nl_fdef_brace     = remove   # fonction
nl_if_brace       = remove
nl_else_brace     = remove
nl_elseif_brace   = remove
nl_for_brace      = remove
nl_while_brace    = remove
nl_do_brace       = remove
nl_switch_brace   = remove
nl_class_brace    = remove

# — Retours à la ligne —
nl_end_of_file    = add
nl_end_of_file_min = 1
nl_max            = 2

# — Commentaires —
cmt_indent_multi        = true
cmt_star_cont           = true
cmt_sp_before_star_cont = 1
cmt_sp_after_star_cont  = 1

# — Divers —
code_width = 120
